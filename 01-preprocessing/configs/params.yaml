# =============================================================================
# 01-preprocessing — corpus youtube (transcricoes de reviews, EN)
# =============================================================================
# CSV bruto gerado por 00-dataset/build_corpus.py em data/raw/youtube/.
# Chaves consumidas por notebooks/01_preprocessing.ipynb:
#   raw_subdir, output_subdir, text_column, id_column, language,
#   csv.sep, csv.encoding, rename, drop, add_constants,
#   min_doc_length, min_words, emoji_handling
# =============================================================================

corpora:

  youtube:
    raw_subdir: youtube
    output_subdir: youtube

    text_column: message
    id_column: post_id
    language: en

    csv:
      sep: ","
      encoding: utf-8

    rename: {}
    drop: []
    add_constants:
      platform: youtube

    min_doc_length: 500
    min_words: 100
    emoji_handling: none

# =============================================================================
default_corpus: youtube
seed: 42