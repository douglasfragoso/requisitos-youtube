# Sementes de aspecto (H6 — modelo guiado por termos)
# Fonte: taxonomia de ficha tecnica escrita pelo autor (componentes e
# atributos de especificacao de produto), NAO os topicos nem as palavras-chave
# de nenhum modelo deste projeto (docs/superpowers/specs/2026-09-23-modelo-
# guiado-design.md, Fase 0).
#
# CONGELADO em 2026-09-26. Mudar sementes depois de ver resultado de qualquer
# fase exige registrar o motivo em docs/idealizacao-artigo.txt §10 e refazer
# as fases afetadas.
#
# Palavras sao lemas; "video" e "like" ficam de fora por serem stopwords do
# corpus (stopwords_emojis, params.yaml).
#
# Decisoes tomadas na revisao de congelamento:
# - Removidas por ambiguidade: key (tecla vs. "important"), build (construcao
#   vs. verbo/"build quality" generico), deal (preco vs. "good deal"
#   generico). "sound" foi mantido em audio apesar da ambiguidade ("sounds
#   good" generico) porque em contraparte de review de produto o uso
#   dominante e sobre audio; a exclusao por frequencia minima (regra da Fase
#   0) e quem vai medir se isso gerou ruido de fato.
# - software/sistema: NAO incluido como aspecto — item de ficha tecnica, mas
#   ligado a ecossistema/categoria (ver "Apple software/apps" em §5.2 da
#   idealizacao); incluir arriscaria H6 medir categoria de novo, disfarcada de
#   aspecto novo.
# - desempenho: MANTIDO mesmo sabendo que tende a colar em categoria ("gaming
#   laptop"). Se sair dependente de categoria, isso e resultado sobre a forca
#   da estrutura de categoria no documento (a propria spec ja prevé essa
#   leitura), nao motivo para excluir o aspecto.
# - Cada aspecto ganhou termos especificos de queixa de dominio (ex.: throttle,
#   dongle, stutter, tinny, creak, grainy), alinhados aos componentes que o
#   NMF restrito ja encontrou (Battery, Ports, Display/brightness,
#   Speakers/software, Keyboard, Price/value, Gaming) — ajuda tanto a
#   concordancia da Fase 2 (H6) quanto, futuramente, o lexico de queixa de H5
#   (spec de sentimento), se as duas listas vierem a ser comparadas.

aspectos:
  bateria:     [battery, charge, charging, charger, mah, drain, endurance, standby]
  termico:     [fan, thermal, temperature, heat, hot, throttle, cooling, noisy, whine]
  tela:        [display, screen, brightness, nit, oled, refresh, resolution, bezel, glare, panel]
  portas:      [port, usb, thunderbolt, hdmi, jack, ethernet, wifi, bluetooth, dongle, connector]
  teclado:     [keyboard, keycap, keystroke, trackpad, touchpad, backlight, travel]
  audio:       [speaker, audio, sound, bass, volume, microphone, mic, tinny, crackle]
  camera:      [camera, lens, photo, sensor, zoom, webcam, selfie, autofocus, grainy]
  preco:       [price, cost, expensive, cheap, dollar, budget, overpriced, value, worth]
  construcao:  [chassis, aluminum, plastic, hinge, sturdy, material, flex, creak, weight]
  desempenho:  [cpu, gpu, processor, performance, ram, memory, benchmark, lag, stutter, fps]
