# =============================================================================
# 03-topic-modeling — NMF global e local de sentencas
# =============================================================================

corpora:

  youtube_sent:
    description: "transcricoes de reviews de produtos no YouTube, EN, nivel sentenca"
    text_column: sentence
    stopwords_emojis:
      - "yeah"
      - "okay"
      - "gonna"
      - "wanna"
      - "gotta"
      - "kind"
      - "lot"
      - "thing"
      - "stuff"
      - "guy"
      - "video"
      - "channel"
      - "subscribe"
      - "like"
    token_pattern: '(?u)\b[a-zA-Z]{2,}\b'
    language: en

default_corpus: youtube_sent
seed: 42

# === Modelo final de sentencas: NMF global -> NMF local ===
# Notebooks: notebooks/nmf/01_nmf_global.ipynb e notebooks/nmf/02_nmf_topicos.ipynb.
# global_run e selected_topics sao preenchidos depois de rodar e ler o NMF global;
# os IDs de tema mudam se o corpus ou o vocabulario mudarem.
final_sentence_pipeline:
  global_k: 20
  global_run: nmf_global_sentence_k20_20261005_221423          # ex.: nmf_global_sentence_k20_AAAAMMDD_HHMMSS
  selected_topics: [1, 3, 5, 7, 9, 10, 11, 14, 15, 17]       # temas globais escolhidos por leitura qualitativa
  local:
    k_range: [2, 6]         # K local: maior NPMI no grid (fronteira NPMI x diversidade)
    no_below: 5
    no_above: 0.5
  local_subdir: restricted_gensim
  expected_sentences: 57952  # total de frases nos temas selecionados (conferencia)
  review_output: null       # nome da pasta de saida em 04-requirements
  top_k: 50
  n_random: 100

# === Avaliacao (NMF local) ===
evaluation:
  top_n_keywords: 10   # palavras por topico no NPMI, na diversidade e no export
