# =============================================================================
# 03-topic-modeling — STM de documentos e NMF global/local de sentencas
# =============================================================================

corpora:

  youtube_doc:
    subdir: youtube
    description: "transcricoes de reviews de produtos no YouTube, EN, nivel documento"
    text_column: message
    date_column: upload_date
    post_id_column: post_id
    covariates:
      - date
      - product_category
    stopwords_emojis:
      - "yeah"
      - "maybe"
      - "basically"
      - "okay"
      - "gonna"
      - "wanna"
      - "gotta"
      - "kind"
      - "lot"
      - "thing"
      - "stuff"
      - "guy"
      - "video"
      - "channel"
      - "subscribe"
      - "like"
    token_pattern: '(?u)\b[a-zA-Z]{2,}\b'
    stm_prevalence_formula: "~ s(as.numeric(as.Date(date))) + product_category"
    stm_min_tokens_per_doc: 200
    stm_best_k: 12  # maior C_v; demais metricas e menor K so desempatem
    language: en

  youtube_sent:
    description: "transcricoes de reviews de produtos no YouTube, EN, nivel sentenca (NMF)"
    text_column: sentence
    stopwords_emojis:
      - "yeah"
      - "okay"
      - "gonna"
      - "wanna"
      - "gotta"
      - "kind"
      - "lot"
      - "thing"
      - "stuff"
      - "guy"
      - "video"
      - "channel"
      - "subscribe"
      - "like"
    token_pattern: '(?u)\b[a-zA-Z]{2,}\b'
    language: en

# =============================================================================
default_corpus: youtube_doc
seed: 42

# === STM ===
stm:
  k_range: [5, 30]
  rscript_path: "Rscript"
  no_below: 5
  no_above: 0.5
  max_em_its: 300
  timeout_sec: 21600

# === Nomeacao (LLM) ===
llm:
  model: "gemma2:2b-instruct-q4_K_M"
  fallback_model: "qwen3:4b"
  base_url: "http://localhost:11434"
  enabled: true
  timeout_per_topic: 30

# === Modelo final de sentencas: NMF global -> NMF local ===
# Notebooks: notebooks/nmf/01_nmf_global.ipynb e notebooks/nmf/02_nmf_topicos.ipynb.
# global_run e selected_topics sao preenchidos depois de rodar e ler o NMF global;
# os IDs de tema mudam se o corpus ou o vocabulario mudarem.
final_sentence_pipeline:
  global_k: 20
  global_run: nmf_global_sentence_k20_20261005_221423          # ex.: nmf_global_sentence_k20_AAAAMMDD_HHMMSS
  selected_topics: [1, 3, 5, 7, 9, 10, 11, 14, 15, 17]       # temas globais escolhidos por leitura qualitativa
  local:
    k_range: [2, 6]         # K local: maior NPMI no grid (fronteira NPMI x diversidade)
    no_below: 5
    no_above: 0.5
  local_subdir: restricted_gensim
  expected_sentences: 57952  # total de frases nos temas selecionados (conferencia)
  review_output: null       # nome da pasta de saida em 04-requirements
  top_k: 50
  n_random: 100

# === Avaliacao ===
evaluation:
  top_n_keywords: 10
  top_n_keywords_metrics: 20
  top_n_keywords_llm: 50
  stm_sigma_prior_grid: [0, 0.3, 0.5, 0.7]
  stm_gamma_prior_grid: ["Pooled", "L1"]
