# =============================================================================
# 03-topic-modeling — YouTube STM configuration
# =============================================================================

corpora:

  youtube_doc:
    subdir: youtube
    description: "transcricoes de reviews de produtos no YouTube, EN, nivel documento"
    text_column: message
    date_column: upload_date
    post_id_column: post_id
    covariates:
      - date
      - product_category
    stopwords_emojis:
      - "yeah"
      - "maybe"
      - "basically"
      - "okay"
      - "gonna"
      - "wanna"
      - "gotta"
      - "kind"
      - "lot"
      - "thing"
      - "stuff"
      - "guy"
      - "video"
      - "channel"
      - "subscribe"
      - "like"
    token_pattern: '(?u)\b[a-zA-Z]{2,}\b'
    stm_prevalence_formula: "~ s(as.numeric(as.Date(date))) + product_category"
    stm_min_tokens_per_doc: 200
    stm_best_k: 12  # maior C_v; demais metricas e menor K so desempatem
    language: en

  youtube_sent:
    description: "transcricoes de reviews de produtos no YouTube, EN, nivel sentenca"
    text_column: sentence
    post_id_column: sent_id
    covariates:
      - product_category
    stopwords_emojis:
      - "yeah"
      - "okay"
      - "gonna"
      - "wanna"
      - "gotta"
      - "kind"
      - "lot"
      - "thing"
      - "stuff"
      - "guy"
      - "video"
      - "channel"
      - "subscribe"
      - "like"
    token_pattern: '(?u)\b[a-zA-Z]{2,}\b'
    stm_prevalence_formula: "~ product_category"
    stm_min_tokens_per_doc: 5
    stm_no_below: 20
    stm_no_above: 0.5
    stm_k_range: [10, 15, 20, 25, 30, 35, 40]
    stm_grid_sample_size: 25000
    stm_best_k: 15
    language: en

# =============================================================================
default_corpus: youtube_doc
seed: 42

# === STM ===
stm:
  k_range: [5, 30]
  rscript_path: "Rscript"
  no_below: 5
  no_above: 0.5
  max_em_its: 300
  timeout_sec: 21600

# === Nomeacao (LLM) ===
llm:
  model: "gemma2:2b-instruct-q4_K_M"
  fallback_model: "qwen3:4b"
  base_url: "http://localhost:11434"
  enabled: true
  timeout_per_topic: 30

# === NMF restrito (refinamento pos-STM, RQ4 — docs/idealizacao-artigo.txt §6) ===
# Decompoe, topico a topico, so as sentencas dos topicos STM classificados como
# "aspecto genuino" (ou limitrofe) em subtemas — nao e comparacao com o STM nem
# 5a granularidade, por isso NAO reaproveita stm_k_range/stm_no_below do corpus:
# subconjuntos por topico sao bem menores que o corpus inteiro.
nmf_restrito:
  youtube_sent:
    stm_run: youtube_sent_20260921_190124  # run final K=15 (pinado, ver docs/idealizacao-artigo.txt §5.2)
    aspect_topics: [1, 3, 4, 6, 8, 10, 11, 12]
    no_below: 5
    no_above: 0.5
    k_range: [2, 6]
    # Variante "concatenada": os 8 topicos agrupados num unico sub-corpus
    # (~56.7k sentencas, ~metade do corpus geral) -- K maior que o range acima
    # (pensado para UM topico isolado), pontos espacados para manter o grid
    # tratavel nesse volume. no_below mais alto que o da versao por-topico
    # porque o sub-corpus concatenado e ~5-10x maior que um topico isolado.
    no_below_concat: 10
    k_values_concat: [8, 12, 16, 20, 24]

# === Modelo guiado por sementes congeladas (H6) ===
guided:
  seeds_file: seeds_aspectos.yaml
  seed_runs: [42, 7, 2026]
  min_df_semente: {youtube_doc: 10, youtube_sent: 20}
  min_sementes_por_aspecto: 2
  keyatm:
    stm_run: youtube_doc_20260927_175555  # R1: stopwords corrigidas; 7 testes de resultados
    rscript_path: Rscript
    no_keyword_topics: 5
    no_keyword_topics_sens: [3, 8]
    agrupar_categorias_min_videos: 20
  gnmf:
    stm_run: youtube_sent_20260921_190124
    aspect_topics: [1, 3, 4, 6, 8, 10, 11, 12]
    livres: 6
    livres_sens: [3, 10]
    lambda_grid: [0.1, 0.5, 1, 2, 5]
    regra_lambda_top_n: 10
    regra_lambda_frac: 0.8
    bootstrap_runs: 1000

# === Avaliacao ===
evaluation:
  run_stability: false
  stability_seeds: [42]
  kappa_threshold: 0.70
  top_n_keywords: 10
  top_n_words_cache: 100
  top_n_keywords_metrics: 20
  semantic_coherence_embedding_model: "qwen3-embedding:0.6b"
  top_n_keywords_llm: 50
  top_n_keywords_viz: 30
  top_n_keywords_npmi: 100
  robustness_top_n_sweep: [10, 15, 20, 25, 30, 50, 100]
  stm_sigma_prior_grid: [0, 0.3, 0.5, 0.7]
  stm_gamma_prior_grid: ["Pooled", "L1"]

# === Assessor de calibracao ===
advisor:
  enabled: true
  provider: openai
  model: "gpt-4.1-mini"
  base_url: null
  api_key_env: OPENAI_API_KEY
  fallback:
    provider: ollama
    model: "gemma4:31b"
    base_url: "https://ollama.com/v1"
    api_key_env: OLLAMA_API_KEY
  viz_panel: true
  max_output_tokens: 4000
  temperature: 0.2
  rounds: 3
  prompts_dir: advisor_prompts
