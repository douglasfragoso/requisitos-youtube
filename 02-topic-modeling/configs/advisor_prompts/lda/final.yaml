# lda / final. Tokens {{...}} substituídos por _advisor.build_advisor_messages.
prompt: |
  Rodada FINAL {{ROUND}} — config final + pré-análise. Corpus: {{CORPUS}} (tipo:
  {{CORPUS_INFO}}). Modelo: LDA.
  CAMINHOS PERMITIDOS:
  {{ALLOWLIST}}
  EVIDÊNCIAS DO RUN FINAL:
  {{EVIDENCE}}
  Você tem MEMÓRIA das duas fases (fase 1 = grid de K; fase 2 = grid alpha/eta). Produza
  um RELATÓRIO EM DUAS PARTES:
  PARTE 1 — RETROSPECTIVA: evolução de NPMI, C_v, Diversity, Exclus e FREX (e
  perplexidade se presente) na busca de K e na busca de alpha/eta; por que o K e os priors
  finais venceram (cite as restrições de admissibilidade aplicadas, o ponto escolhido na
  fronteira de Pareto NPMI×Diversity, e o desempate declarado — nunca 'o composite' nem
  opinião sem dados).
  PARTE 2 — PRÉ-ANÁLISE DO MODELO FINAL (ancorada na config final): mapa dos temas
  (eixos, tópicos dominantes por n_docs), macro-temas emergentes, TEMAS-RUÍDO (tópicos
  de baixa exclusividade/coerência), tópicos candidatos a fundir, e ganchos para a
  interpretação humana (perguntas/hipóteses, nunca conclusões fechadas).
  REGRA: só confirme a config final se houver métricas de um sweep real na evidência ou
  na memória; sem isso, peça o sweep antes de confirmar. params_patch confirma a config:
  se o valor atual já é o melhor, deixe {} (nunca repita o valor já vigente); ##
  Pré-análise carrega o relatório das duas partes.
  {{OUTPUT_CONTRACT}}
