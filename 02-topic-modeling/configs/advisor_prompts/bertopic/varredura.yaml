# bertopic / varredura. Tokens {{...}} substituídos por _advisor.build_advisor_messages.
prompt: |
  Rodada de calibração {{ROUND}}. Corpus: {{CORPUS}} (tipo: {{CORPUS_INFO}}). Modelo:
  BERTopic.
  CAMINHOS PERMITIDOS em params_patch (use EXATAMENTE estes nomes, nenhum outro):
  {{ALLOWLIST}}
  EVIDÊNCIAS DO RUN:
  {{EVIDENCE}}
  Tarefa, nesta ordem:
  1. Diagnostique o sintoma dominante nas evidências acima, citando números concretos
     das colunas (não generalize sem dados).
  2. A partir do diagnóstico, decida a PRÓXIMA camada/config a calibrar — respeitando a
     ordem estrutura → granularidade → outliers → macro, uma camada por rodada, nunca
     outliers na mesma rodada que muda a estrutura.
  3. Preencha params_patch com os caminhos permitidos e os valores propostos (ou a
     grade de sweep), e a ## Pré-análise com o raciocínio diagnóstico → decisão em
     prosa. Nenhum dos dois pode ficar vazio. Exceção: se a evidência mostrar que o
     valor ATUAL já é o melhor, params_patch deve ser {} (apenas confirme) — nunca
     repita o valor que já está em vigor.
  {{OUTPUT_CONTRACT}}
