# =============================================================================
# 04-topic-modeling — Multi-corpus configuration
# =============================================================================
# Cada entrada em `corpora:` carrega o que varia por corpus (subdir, coluna de
# texto, lista de stopwords-ruído, fórmula STM, agregação). Os parâmetros dos
# algoritmos (BERTopic, LDA, NMF, STM) ficam em seções compartilhadas.
#
# Selecione o corpus editando `default_corpus` no final deste arquivo ou a célula
# `CORPUS = "..."` no início de cada notebook em `notebooks/`.
# =============================================================================

corpora:

  # ---------------------------------------------------------------------------
  # Corpus folha — Folha de Sao Paulo 2024 (PT-BR, validacao canonica LDA + STM)
  # ---------------------------------------------------------------------------
  folha:
    subdir: folha
    description: "notícias jornalísticas, textos longos (PT-BR)"
    text_column: message
    date_column: data
    post_id_column: post_id
    covariates:
      - date
      - category
    stopwords_emojis:
      - "atilde"
      - "ccedil"
      - "iacute"
      - "eacute"
      - "aacute"
      - "otilde"
      - "uacute"
      - "ocirc"
      - "acirc"
      - "ecirc"
      - "novamente"
      - "representando"
      - "quot"    # resíduo de &quot; HTML — polui T4 (cinema/cultura)
      - "the"     # artigo inglês não filtrado — polui c-TF-IDF de tópicos PT
      - "seta"    # símbolo de lista (→) tokenizado — ruído em T3/T21
    # Ruido especifico do NMF (nao usado pelo BERTopic/LDA — ver lemmatize_corpus
    # `extra_stopwords`): dateline/byline de aeroporto que o NMF concentrou num
    # topico proprio, triplicado (T6/T10/T20, run folha_20260713_200848). Nomes
    # de cidade sao conteudo legitimo em outros contextos — por isso isolado
    # aqui em vez de ir para stopwords_emojis (que o BERTopic tambem consome).
    nmf_stopwords_extra:
      - "guarulhos"
      - "galeao"
      - "curitiba"
      - "fortaleza"
      - "recife"
    token_pattern: '(?u)\b[a-zA-ZÀ-ÿ]{2,}\b'
    bertopic_language: multilingual
    stm_prevalence_formula: "~ s(as.numeric(as.Date(date))) + category"
    stm_min_tokens_per_doc: 200
    # STM pinado 2026-07-16 (run folha_20260716_162249): grids concluídos e
    # desligados — K=25 (pico C_v 0.6775 no grid 3..30) e sigma=0.7/gamma=L1
    # (C_v 0.6799 no grid 4x2; spread total do grid foi de só ~0.0035).
    # Remover estas 3 chaves reativa os grids (com cache) nos notebooks.
    stm_best_k: 25
    stm_sigma_prior: 0.7
    stm_gamma_prior: "L1"
    language: pt

  # ---------------------------------------------------------------------------
  # Corpus tweets_bre2022 — Tweets BR Eleições 2022 (PT-BR, Zenodo 14834749)
  # ---------------------------------------------------------------------------
  tweets_bre2022:
    subdir: tweets_bre2022
    description: "tweets, textos curtos (PT-BR)"
    text_column: message
    date_column: data
    post_id_column: post_id
    covariates:
      - category             # YYYY-MM (mês) — proxy temporal para análise eleitoral
    stopwords_emojis:
      - "coração_roxo"
      - "coração_vermelho"
      - "coração_amarelo"
      - "coração_azul"
      - "coração_verde"
      - "coração_laranja"
      - "coração_preto"
      - "coração_branco"
      - "brilhos"
      - "marca_de_seleção_branca"
      - "rosto_sorridente_com_olhos_de_coração"
      - "rosto_sorridente_com_3_corações"
      - "rosto_sorridente_com_olhos_sorridentes"
      - "rosto_com_olho_piscando"
      - "rosto_alegre"
      - "rosto_apaixonado"
      - "mãos_aplaudindo"
      - "polegar_para_cima"
      - "polegar_para_baixo"
      - "fogo"
      - "fogos_de_artifício"
      - "câmera"
      - "câmera_com_flash"
    token_pattern: '(?u)\b[a-zA-ZÀ-ÿ_]{2,}\b'
    bertopic_language: multilingual
    stm_prevalence_formula: "~ category"   # category = mês YYYY-MM (proxy temporal eleitoral)
    stm_min_tokens_per_doc: 5    # tokens brutos; mediana tweets = 19 (30 descartaria ~70%)
    # STM pinado 2026-07-16 (run tweets_bre2022_20260716_175301): grids concluídos
    # e desligados — K=20 (pico C_v 0.6113 no grid 3..30; K=25 cai p/ 0.5596) e
    # sigma=0.0/gamma=L1 (C_v 0.5725 no grid 4x2). C_v final 0.588 < folha 0.680,
    # consistente com H2 (texto curto degrada coerência).
    # Nota (corrigido 2026-07-16, auditoria): o run canônico é o …175301
    # (max_em_its=300, convergiu em 222 its), não o …161613 citado antes — esse
    # rodou sob o teto antigo (max_em_its=150), parou sem convergir e subestimava
    # o C_v final (0.572 vs 0.588). Ver ANALISE_FINAL.md §6.1.
    # Remover estas 3 chaves reativa os grids (com cache) nos notebooks.
    stm_best_k: 20
    stm_sigma_prior: 0.0
    stm_gamma_prior: "L1"
    language: pt
    # REELEITO 2026-08-29: sweep de 23/08 estava contaminado pelo bug do MMR
    # (representation_model direto -> {"MMR": ...} como aspecto, diversificando
    # topics_keywords antes de medir NPMI/Diversity em vez de c-TF-IDF puro —
    # ver params.yaml > evaluation.run_param_sweep). Sweep corrigido rerodado
    # (360 combos, single-seed=42, ver secao 1.1 do protocolo — multi-seed nao
    # e exigencia aqui) e `_selecao.py bertopic tweets_bre2022` reaplicado:
    # fronteira de Pareto NPMI x Diversity x cobertura, 12 de 19 admissiveis
    # (K in [10,25], n_raw<=2K), desempate por maior cobertura. Unica mudanca
    # frente a 23/08: min_samples null -> 5 (resto da config confirmado igual).
    # Ver data/output/tweets_bre2022/bertopic/selecao_bertopic.csv. Aplicado
    # via _helpers.apply_bertopic_overrides (merge raso por chave; não muta o
    # bloco compartilhado nem afeta outros corpora).
    bertopic_overrides:
      umap:
        n_neighbors: 10   # eleito; antes: 15
      hdbscan:
        min_cluster_size: 40           # eleito; antes: 30 (coincide com o do folha)
        min_samples: 5                 # reeleito 2026-08-29 (antes: null, sob o
                                        # sweep contaminado por MMR) — agora igual
                                        # ao padrao compartilhado (calibrado pro
                                        # folha), mas eleito independentemente
        cluster_selection_method: eom  # eleito; antes: leaf
      reduce_topics_nr: 25   # eleito; override explicito — o padrao compartilhado
                              # agora e 20 (calibrado pro folha), tweets precisa de 25
      # reduce_outliers: off para os dois corpora via bloco compartilhado
      # (enabled=false, secao 1.4) — threshold abaixo fica inerte, registro
      # historico do que o sweep pre-protocolo de 2026-07-03 escolhera.
      reduce_outliers:
        threshold: 0.05

default_corpus: tweets_bre2022
seed: 42

# =============================================================================
# BERTopic (compartilhado — embedder e algoritmo são multilíngues)
# =============================================================================
bertopic:
  embedding_model: "qwen3-embedding:8b"
  embedding_backend: "ollama"          # "ollama" ou "sentence_transformers"
  embedding_dimension: null            # null = nativo 4096d (qwen3-embedding:8b)
  embedding_suffix: "4096d"            # sufixo do .npy gerado pelo 02-embeddings
  umap:
    n_components: 5
    n_neighbors: 10        # ← 20; composite sweep: nn=10 domina K=20-30
    min_dist: 0.0
    metric: "cosine"
  # ATUALIZADO 2026-08-23: config eleita pelo protocolo (secao 1.4) sobre o sweep
  # de 72 combos (single-seed, com NPMI) rodado nesta data — `_selecao.py bertopic
  # folha`, fronteira de Pareto NPMI x Diversity x cobertura, 22 de 87 admissiveis
  # (K in [15,30], n_raw<=2K), desempate por maior cobertura. Substitui a config
  # anterior (mcs=8/ms=null/nr=25), que vinha do criterio antigo de escore
  # composto e nunca tinha sido validada sob NPMI. Ver
  # data/output/folha/bertopic/selecao_bertopic.csv.
  hdbscan:
    min_cluster_size: 40   # eleito (protocolo secao 1.4, 2026-08-23); antes: 8
    min_samples: 5         # eleito; antes: null (= default HDBSCAN = mcs)
    cluster_selection_method: "eom"   # eleito; mesmo valor de antes
  min_topic_size: 40       # = mcs; evita filtrar clusters válidos antes do reduce_topics
  mmr_diversity: 0.2
  reduce_topics_nr: 20     # eleito (protocolo secao 1.4, 2026-08-23); antes: 25
  macro_k: 10              # ← 8; sweep: maior cluster 665 docs (vs 1313 em macro_k=8)
  vectorizer:
    ngram_range: [1, 2]
    # token_pattern e language vêm do corpus_cfg (variam por idioma)
  # DESLIGADO 2026-08-23 (protocolo secao 1.4): "enabled: true" e o "melhor composite"
  # no comentario abaixo sao do criterio ANTIGO (escore composto), que o protocolo
  # abandonou. Sob o protocolo em vigor nenhuma estrategia de reduce_outliers compra
  # coerencia com cobertura sem custo em Exclusividade, e o resíduo (-1) e tratado
  # como objeto analisavel, nao lixo a reatribuir — "reduce_outliers = off nos dois
  # niveis" (docs/protocolo_selecao.md secao 1.4). strategy/threshold ficam como
  # registro historico do que o sweep pre-protocolo escolhera.
  reduce_outliers:
    enabled: false          # valor antigo (pre-protocolo): true; threshold sweep: c-tf-idf 0.15 melhor composite
    strategy: "c-tf-idf"   # inerte enquanto enabled=false
    threshold: 0.15        # inerte enquanto enabled=false

# === LDA ===
lda:
  k_range: [5, 30]
  no_below: 5
  no_above: 0.5

# === NMF ===
nmf:
  k_range: [5, 30]
  no_below: 5
  no_above: 0.5
  passes: 20

# === STM ===
stm:
  k_range: [5, 30]
  # Caminho do Rscript. Por padrão usa o `Rscript` no PATH (funciona em
  # Linux/Mac e em Windows se R foi instalado com "Add to PATH"). Se precisar
  # apontar para um binário específico, edite aqui (ex: Windows sem PATH):
  #   "C:/Program Files/R/R-4.5.3/bin/Rscript.exe"
  rscript_path: "Rscript"
  no_below: 5       # = LDA/NMF; consumido por lemmatize_corpus(model_key="stm") e pelo prepDocuments do R
  no_above: 0.5     # = LDA/NMF
  max_em_its: 300   # teto de iterações EM do stm(). 2026-07-16: subido de 150 —
                    # o treino final do tweets_bre2022 bateu no teto (150 its,
                    # sem convergir); folha converge em ~92, não é afetada.
  timeout_sec: 21600  # 6h por chamada R (grid_k da folha leva ~1-3h)
  # prevalence_formula e min_tokens_per_doc vêm do corpus_cfg

# === Nomeação (LLM, multilíngue) ===
llm:
  model: "gemma2:2b-instruct-q4_K_M"
  fallback_model: "qwen3:4b"
  base_url: "http://localhost:11434"
  enabled: true
  timeout_per_topic: 30

# === Avaliação ===
evaluation:
  # DESLIGADO 2026-08-23: sem multi-seed em nenhum modelo (protocolo secao 1.1,
  # decisao estendida a todos os bracos em 23/08 — a A2 do LDA foi removida pelo
  # mesmo motivo). Com stability_seeds=[42] o loop da Cell 43/44 so refitaria o
  # seed 42 contra ele mesmo — refit inteiro (UMAP+HDBSCAN) sem produzir Jaccard
  # nenhum, so custo. run_stability=false pula a celula inteira.
  run_stability: false
  stability_seeds: [42]
  kappa_threshold: 0.70
  top_n_keywords: 10
  top_n_words_cache: 100
  top_n_keywords_metrics: 20
  # Modelo de embedding SÓ para a Coerência Semântica (métrica sobre keywords curtas).
  # Desacoplado do bertopic.embedding_model (8B) porque o 8B é pesado demais para
  # centenas de requisições curtas nesta máquina (7-19s/req + 500 frequente do Ollama).
  # Se ausente/None, cai no bertopic.embedding_model. Documentos seguem no 8B.
  semantic_coherence_embedding_model: "qwen3-embedding:0.6b"
  top_n_keywords_llm: 50   # prompt_builder_custom lê top_n_llm do escopo (cell 9)
  top_n_keywords_viz: 30
  top_n_keywords_npmi: 100
  robustness_top_n_sweep: [10, 15, 20, 25, 30, 50, 100]
  # Sweep de estrategias/threshold de reduce_outliers (_helpers.sweep_outlier_strategies/
  # sweep_outlier_threshold). Custoso (refit completo x estrategia x seed) — off por padrao.
  run_outlier_sweep: false   # tweets_bre2022: RECALIBRADO 2026-07-03 sob nn=15/mcs=30/leaf (run
                              # tweets_bre2022_20260703_094835) — c-tf-idf confirmado como melhor estratégia
                              # também na estrutura nova. Ver PIPELINE_TWEETS_BERTOPIC.md §13.
  outlier_sweep_seeds: [42]  # 1 seed suficiente para comparar estratégias
  outlier_sweep_strategies: ["off", "c-tf-idf", "embeddings", "probabilities", "distributions"]
  # Sweep de threshold por estrategia (sweep_outlier_threshold): responde se
  # reducao parcial (threshold > 0) bate reducao total (0.0) ou off.
  # c-tf-idf/probabilities/distributions: scores em [0,1]; 0.0 = realoca tudo.
  # embeddings: similaridade coseno tipicamente alta — faixa 0.50-0.90.
  run_threshold_sweep: false # tweets_bre2022: RECALIBRADO 2026-07-03 sob nn=15/mcs=30/leaf — threshold=0.05
                              # venceu por composite (0.832 vs 0.724 do 0.15 herdado); cobertura 62.4%->83.5%
                              # com C_v/Diversity/Exclus quase inalterados. Aplicado em bertopic_overrides.
  threshold_sweep_seeds: [42]
  threshold_sweep_grids:
    c-tf-idf:      [0.0, 0.05, 0.10, 0.15, 0.20, 0.30]
    embeddings:    [0.0, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90]
    probabilities: [0.0, 0.05, 0.10, 0.15, 0.20, 0.30]
    distributions: [0.0, 0.05, 0.10, 0.15, 0.20, 0.30]
  # Grid UMAP n_neighbors x HDBSCAN min_cluster_size x HDBSCAN min_samples
  # (_helpers.sweep_bertopic_grid). Refit completo por (seed × nn × mcs × ms × csm);
  # reduce_nr é só pós-processamento (barato, copy-per-variant).
  # min_samples é o parâmetro mais crítico para texto curto (tweets): controla
  # conservadorismo do HDBSCAN → maior = mais outliers. Varrer explicitamente.
  # 30 e 35 removidos do mcs (redundantes com 25/40 no primeiro sweep de tweets).
  # K=10/15 removidos do reduce_nr (insuficientes para 200k tweets eleitorais).
  # 2 seeds mínimo para Jaccard stability ser confiável (docstring sweep_bertopic_grid).
  # PROTOCOLO 2026-08-16 (revogado 2026-08-23): o sweep tinha voltado a ligar em modo
  # multi-seed para avaliar A1 (K identico entre seeds) e a estabilidade Jaccard. Essa
  # justificativa nao existe mais: a decisao de 17/08 (protocolo secao 1.1) ja tinha
  # tirado A1 e a estabilidade de TODOS os bracos, e em 23/08 a mesma decisao foi
  # reafirmada e estendida (nada de multi-seed em nenhum modelo, LDA incluido — a
  # A2 do LDA foi removida pelo mesmo motivo). Sweep OFF de novo; se algum dia rodar,
  # roda em seed unica (42), sem Stability/Stab_std na selecao.
  # Custo, caso ligado: refit por (nn x mcs x ms x csm) x seed; reduce_nr sem refit.
  #   3 nn x 4 mcs x 3 ms x 2 csm = 72 combos x 1 seed = 72 fits (grid partilhado
  #   entre os dois corpora — nao ha override por corpus destas chaves).
  # CORTADO 2026-08-23, com evidencia dos sweeps historicos (folha 2026-06-27,
  # tweets 2026-06-30, mesmo grid nn/mcs/csm): mcs 6->4, removendo 15 (quase
  # identico a 8 nos dois corpora — outlier_post/C_v/Diversity/Exclus variam
  # <0.01) e 35 (quase identico a 30, que e o PICO de C_v em tweets: 0.653 vs
  # 0.578 em mcs=8 — mais informativo manter 30 que 35). nn e csm intocados:
  # csm e o eixo de maior impacto medido (outlier_post eom vs leaf difere >2x
  # nos dois corpora) e nn tem efeito real e nao-monotonico (nao da pra prever
  # um valor pelo outro). ms mantido nos 3 valores apesar do sweep antigo do
  # folha nunca te-lo variado (so testou null) — e chave compartilhada com
  # tweets, onde e o parametro mais critico pra outlier rate (texto curto).
  # DESLIGADO 2026-08-29: sweep corrigido (fix do MMR de 2026-08-25) rerodado
  # nos dois corpora e reeleicao feita via `_selecao.py bertopic <corpus>`.
  # folha: escolhida bate exatamente com a config ja vigente (compartilhada,
  # nn=10/mcs=40/ms=5/eom/nr=20) -- nenhuma mudanca. tweets_bre2022: unica
  # mudanca foi ms null -> 5 (ver corpora.tweets_bre2022.bertopic_overrides).
  # Religar so se o grid mudar de novo.
  run_param_sweep: false
  param_sweep_seeds: [42]
  param_sweep_n_neighbors: [10, 15, 20]
  param_sweep_min_cluster_size: [8, 25, 30, 40]
  param_sweep_min_samples: [null, 5, 15]   # null=default(=mcs); 5=permissivo; 15=conservador (crítico em tweets)
  param_sweep_cluster_selection_methods: ["leaf", "eom"]
  param_sweep_reduce_topics_nr: [10, 15, 20, 25, 30]
  param_sweep_macro_k: [4, 5, 6, 7, 8, 10, 12]  # NOTA: chave não consumida por nenhuma função em _helpers.py
                                                  # (macro_k sweep é gerado inline no notebook, não por este grid) — inerte.
  # LDA alpha/eta hyperparameter grid (fixo K=BEST_K; passes=10 para velocidade)
  # alpha: prior Dirichlet doc→topico
  #   'symmetric' = uniforme; 'asymmetric' = 1/k (temas dominantes);
  #   float baixo (0.01) = docs concentrados em poucos topicos; alto (0.5) = difusos
  # eta: prior Dirichlet topico→palavra
  #   null = gensim default (1/K); float baixo (0.01) = vocab concentrado (topicos distintos)
  lda_alpha_grid: ['symmetric', 'asymmetric', 0.01, 0.1, 0.5]
  lda_eta_grid: [null, 0.01, 0.1]
  # NMF kappa/minimum_probability hyperparameter grid (fixo K=BEST_K; passes=10 para velocidade)
  # kappa: passo de gradiente da atualizacao de W (maior = converge mais rapido, pode instabilizar)
  # minimum_probability: piso de esparsidade nas distribuicoes doc-topico e topico-palavra
  #   (analogo a um eta baixo no LDA)
  # 2026-07-13: estendido de [0.5, 1.0, 2.0] apos run folha escolher kappa=2.0
  # (topo do grid testado -- otimo suspeito de estar na borda). tweets_bre2022
  # escolheu kappa=1.0 (interior), sem sinal de borda.
  nmf_kappa_grid: [0.5, 1.0, 2.0, 3.0, 4.0]
  nmf_min_prob_grid: [0.0, 0.01, 0.05]
  # STM sigma.prior/gamma.prior hyperparameter grid (fixo K=BEST_K)
  # sigma.prior: regularizacao [0,1] da covariancia entre topicos induzida pelas
  #   covariaveis de prevalencia (0 = sem regularizacao; maior = efeitos encolhidos)
  # gamma.prior: prior dos coeficientes de prevalencia ('Pooled' = normal
  #   hierarquica, default; 'L1' = esparso via glmnet)
  stm_sigma_prior_grid: [0, 0.3, 0.5, 0.7]
  stm_gamma_prior_grid: ["Pooled", "L1"]

# =============================================================================
# Assessor de calibração (LLM — ferramenta de calibração, NÃO usada no pipeline
# de produção). Primary = OpenAI/GPT (nuvem; chave via env). Fallback automático
# = Ollama Cloud com gemma4:31b (se o primary falhar por chave/rede/rate/timeout,
# o assessor tenta o fallback na mesma rodada). Anthropic NÃO é usado.
# =============================================================================
advisor:
  enabled: true
  # --- Primary: OpenAI (GPT) ---
  provider: openai                        # openai | ollama
  # gpt-4.1-mini é o oficial: é ele que assina as 51 pré-análises publicadas
  # (rodapé "openai/gpt-4.1-mini"). Trocar aqui muda a Leitura A dos próximos
  # re-runs e mistura dois modelos entre os callouts do site.
  model: "gpt-4.1-mini"
  base_url: null                          # null = endpoint padrão da OpenAI na nuvem
  api_key_env: OPENAI_API_KEY             # exporte a chave: export OPENAI_API_KEY=...
  # --- Fallback automático (usado só se a chamada ao primary estourar) ---
  fallback:
    provider: ollama                      # Ollama Cloud (na nuvem, não o PC local)
    model: "gemma4:31b"                   # confirmado no plano atual (2026-07-20)
    base_url: "https://ollama.com/v1"     # endpoint OpenAI-compat do Ollama Cloud
    # OLLAMA_API_KEY = TOKEN de API (ollama.com/settings/keys), NÃO a chave SSH.
    # Modelos "requires a subscription" (ex.: qwen3.5:397b) dão 403 no plano grátis.
    api_key_env: OLLAMA_API_KEY           # bearer token do Ollama Cloud
  # --- Painel da fase site (auditoria de visualizações) ---
  # true = consulta os DOIS providers acima na MESMA rodada e publica as duas
  # leituras no mesmo advisor_viz/<slug>.md ("Leitura A" = primary, "Leitura B"
  # = fallback), cada uma sem ver a outra. Se só um responder, o arquivo sai com
  # uma leitura só e o ledger marca `partial_panel`; se os dois falharem, a
  # rodada levanta. Afeta APENAS a fase site — run_advisor_round (calibração de
  # hiperparâmetros) segue com primary + fallback-em-caso-de-falha.
  # false = comportamento antigo (uma leitura por rodada).
  viz_panel: true
  max_output_tokens: 4000
  temperature: 0.2
  rounds: 3
  prompts_dir: advisor_prompts         # pasta configs/advisor_prompts/ (um yaml por prompt: <metodo>/{system,varredura,final}.yaml + shared.yaml)
